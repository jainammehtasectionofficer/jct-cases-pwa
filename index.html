<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#252f78">
  <meta name="description" content="Julie Charitable Trust dog rescue case management">
  <title>JCT Cases</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/jct-icon-192.png">
  <link rel="apple-touch-icon" href="./icons/jct-icon-192.png">
  <meta name="application-name" content="JCT Cases">
  <meta name="apple-mobile-web-app-title" content="JCT Cases">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #f2f6f8; color: #172b4d; font-family: Arial, sans-serif; }
    main { width: 100%; max-width: 430px; background: #fff; border-radius: 22px; padding: 28px 22px; text-align: center; box-shadow: 0 6px 24px #0000000d; }
    .logo { width: min(190px, 62vw); height: 190px; max-height: 190px; object-fit: contain; display: block; margin: 0 auto 18px; }
    h1 { color: #252f78; font-size: clamp(25px, 6vw, 32px); margin: 0 0 8px; }
    p { color: #667085; line-height: 1.5; margin: 0 0 22px; }
    .button { display: block; width: 100%; border-radius: 13px; padding: 16px 18px; background: #252f78; color: white; font-weight: 700; font-size: 16px; text-decoration: none; }
    .note { font-size: 12px; margin-top: 18px; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./icons/jct-icon-192.png" alt="Julie Charitable Trust logo">
    <h1>JCT Cases</h1>
    <p>Julie Charitable Trust · Navsari<br>Dog Rescue Case Management</p>
    <a class="button" href="https://script.google.com/macros/s/AKfycbwrxE-UignTUAwfRCLRXyZ1TQLaf_Z6VLICvjaihZGnO_5RTns58a90qeKOwhDBzxRznQ/exec">Open JCT Cases</a>
    <p class="note">Internet connection required. Registration and search open in the existing secure Google Apps Script app.</p>
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
